# Laboratório Virtual: Scada-LTS + Ponte (gateway Modbus) juntos, no mesmo Docker.
#
# A Ponte e o Scada-LTS compartilham a MESMA rede, cujo dono é o contêiner mínimo "rede". Assim os dispositivos Modbus
# da Ponte (127.0.0.11 a 127.0.0.14, porta 5020) ficam no "localhost" do Scada-LTS, exatamente como no Windows, e não
# é preciso encaminhar portas. Como a rede é do contêiner "rede" (que nunca reinicia), dá para reiniciar a Ponte ou o
# Scada-LTS separadamente sem perder a conexão entre eles.
#
#   1) copie .env.example para .env e preencha SERVIDOR e CHAVE (chave de ativação de "Meu laboratório");
#   2) docker compose up -d --build
#   3) abra http://localhost:8080/Scada-LTS/ (ou a SCADA_PORT do .env) e importe docker/scada-lts/scada-lts-import.json
#      (Administração > Importar/Exportar). Veja docs/07-docker-scada-ponte.md.
#
# Depois da primeira ativação a credencial fica no volume "ponte_data": nas próximas vezes a CHAVE não é mais necessária.
name: scada-lab

services:
  rede:
    container_name: rede
    image: alpine:3
    command: ["sleep", "infinity"]
    restart: unless-stopped
    ports:
      - "${SCADA_PORT:-8080}:8080" # Scada-LTS (mude SCADA_PORT no .env se a 8080 estiver ocupada) (todos os contêineres abaixo usam a rede deste)

  database:
    container_name: mysql
    image: mysql/mysql-server:8.0.32
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=scadalts
    volumes:
      - db_data:/var/lib/mysql
    command: --log_bin_trust_function_creators=1

  ponte:
    container_name: ponte
    build: ./ponte
    image: lab/ponte:latest
    restart: unless-stopped
    network_mode: service:rede
    environment:
      - SERVIDOR=${SERVIDOR:-https://scsep.joaopedromagalhaes.com.br}
      - CHAVE=${CHAVE:-}
      - NOME=${NOME:-Scada-LTS (Docker)}
    volumes:
      - ponte_data:/data
    depends_on:
      - rede
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(5020,'127.0.0.14').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  scadalts:
    container_name: scadalts
    image: scadalts/scadalts:latest
    restart: unless-stopped
    network_mode: service:rede
    environment:
      - CATALINA_OPTS=-Xmx1G -Xms512M
    depends_on:
      rede:
        condition: service_started
      database:
        condition: service_healthy
      ponte:
        condition: service_healthy
    volumes:
      - tomcat_log:/usr/local/tomcat/logs
    command:
      - /usr/bin/wait-for-it
      - --host=database # o banco, pelo nome do serviço (é o que o Scada-LTS usa na conexão JDBC)
      - --port=3306
      - --timeout=90
      - --strict
      - --
      - /usr/local/tomcat/bin/catalina.sh
      - run

volumes:
  db_data:
  ponte_data:
  tomcat_log:
